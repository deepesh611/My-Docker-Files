---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/info-widgets/

- datetime:
    text_size: xl
    format:
      dateStyle: short
      timeStyle: short
      hour12: true

- search:
    provider: google # google, duckduckgo, bing, baidu, brave or custom
    focus: true # Optional, will set focus to the search bar on page load
    # showSearchSuggestions: true # Optional, will show search suggestions. Defaults to false
    target: _blank # One of _self, _blank, _parent or _top
    
- resources:
    label: System Stats
    cpu: true
    memory: true
    # cputemp: true
    # tempmin: 0 # optional, minimum cpu temp
    # tempmax: 100 # optional, maximum cpu temp
    # uptime: true
    units: metric # only used by cpu temp, options: 'imperial' or 'metric'
    refresh: 3000 # optional, in ms
    diskUnits: bytes # optional, bytes (default) or bbytes. Only applies to disk
    network: true # optional, uses 'default' if true or specify a network interface name
    disk: /


# - openweathermap:
#     label: Kyiv #optional
#     units: metric # or imperial
#     provider: openweathermap
#     cache: 5 # Time in minutes to cache API responses, to stay within limits
#     format: # optional, Intl.NumberFormat options
#       maximumFractionDigits: 1
      
- stocks:
    provider: finnhub
    color: true # optional, defaults to true
    cache: 1 # optional, default caches results for 1 minute
    watchlist:
      - USD
      - INR
      - APLE
      - INTL
      - NVDA